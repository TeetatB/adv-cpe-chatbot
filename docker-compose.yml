services:
  lukchang-move:
    build: .
    ports:
      - "8080:8080"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      XAI_API_KEY: ${XAI_API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
